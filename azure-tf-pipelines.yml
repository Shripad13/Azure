trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main


variables:

  terraformVersion: '1.9.8'

  terraformDirectory: 'terraform'

  azureServiceConnection: 'sc-azure-devops'

  backendResourceGroup: 'rg-terraform-state'

  backendStorageAccount: 'stterraformstatexxx'

  backendContainer: 'tfstate'


stages:

# ==========================================================
# STAGE 1 - VALIDATE
# ==========================================================

- stage: Validate

  displayName: 'Terraform Validate'

  jobs:

  - job: ValidateTerraform

    displayName: 'Validate Terraform'

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1

      displayName: 'Install Terraform'

      inputs:
        terraformVersion: $(terraformVersion)


    - script: |

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'

      workingDirectory: $(terraformDirectory)


    - task: AzureCLI@2

      displayName: 'Terraform Init'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=validation.tfstate"

      workingDirectory: $(terraformDirectory)


    - script: |

        terraform validate

      displayName: 'Terraform Validate'

      workingDirectory: $(terraformDirectory)


# ==========================================================
# STAGE 2 - PLAN DEV
# ==========================================================

- stage: Plan_Dev

  displayName: 'Terraform Plan - Dev'

  dependsOn: Validate

  jobs:

  - job: TerraformPlan

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1

      inputs:
        terraformVersion: $(terraformVersion)


    - task: AzureCLI@2

      displayName: 'Terraform Init - Dev'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=dev.tfstate"

      workingDirectory: $(terraformDirectory)


    - task: AzureCLI@2

      displayName: 'Terraform Plan - Dev'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform plan \
            -var-file=environments/dev.tfvars \
            -out=$(Build.ArtifactStagingDirectory)/dev.tfplan

      workingDirectory: $(terraformDirectory)


    - publish: '$(Build.ArtifactStagingDirectory)/dev.tfplan'

      artifact: terraform-dev-plan


# ==========================================================
# STAGE 3 - APPLY DEV
# ==========================================================

- stage: Apply_Dev

  displayName: 'Terraform Apply - Dev'

  dependsOn: Plan_Dev

  jobs:

  - deployment: ApplyDev

    displayName: 'Apply Dev Infrastructure'

    environment: 'dev'

    pool:
      vmImage: ubuntu-latest

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current

            artifact: terraform-dev-plan


          - task: TerraformInstaller@1

            inputs:
              terraformVersion: $(terraformVersion)


          - task: AzureCLI@2

            displayName: 'Terraform Init'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=dev.tfstate"

            workingDirectory: $(terraformDirectory)


          - task: AzureCLI@2

            displayName: 'Terraform Apply'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform apply \
                  "$(Pipeline.Workspace)/terraform-dev-plan/dev.tfplan"

            workingDirectory: $(terraformDirectory)



# After Dev succeeds:
# ==========================================================
# STAGE 4 - PLAN STAGING
# ==========================================================

- stage: Plan_Staging

  displayName: 'Terraform Plan - Staging'

  dependsOn: Apply_Dev

  jobs:

  - job: TerraformPlan

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1

      inputs:
        terraformVersion: $(terraformVersion)


    - task: AzureCLI@2

      displayName: 'Terraform Init'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=staging.tfstate"

      workingDirectory: $(terraformDirectory)


    - task: AzureCLI@2

      displayName: 'Terraform Plan'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform plan \
            -var-file=environments/staging.tfvars \
            -out=$(Build.ArtifactStagingDirectory)/staging.tfplan

      workingDirectory: $(terraformDirectory)


    - publish: '$(Build.ArtifactStagingDirectory)/staging.tfplan'

      artifact: terraform-staging-plan


# ==========================================================
# STAGE 5 - APPLY STAGING
# ==========================================================

- stage: Apply_Staging

  displayName: 'Terraform Apply - Staging'

  dependsOn: Plan_Staging

  jobs:

  - deployment: ApplyStaging

    displayName: 'Apply Staging Infrastructure'

    environment: 'staging'

    pool:
      vmImage: ubuntu-latest

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current

            artifact: terraform-staging-plan


          - task: TerraformInstaller@1

            inputs:
              terraformVersion: $(terraformVersion)


          - task: AzureCLI@2

            displayName: 'Terraform Init'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=staging.tfstate"

            workingDirectory: $(terraformDirectory)


          - task: AzureCLI@2

            displayName: 'Terraform Apply'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform apply \
                  "$(Pipeline.Workspace)/terraform-staging-plan/staging.tfplan"

            workingDirectory: $(terraformDirectory)


# After Stage succeeds:
# ==========================================================
# STAGE 4 - PLAN PRDOUCTION
# ==========================================================


- stage: Plan_Production

  displayName: 'Terraform Plan - Production'

  dependsOn: Apply_Staging

  jobs:

  - job: TerraformPlan

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1

      inputs:
        terraformVersion: $(terraformVersion)


    - task: AzureCLI@2

      displayName: 'Terraform Init'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform init \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=prod.tfstate"

      workingDirectory: $(terraformDirectory)


    - task: AzureCLI@2

      displayName: 'Terraform Plan'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          terraform plan \
            -var-file=environments/prod.tfvars \
            -out=$(Build.ArtifactStagingDirectory)/prod.tfplan

      workingDirectory: $(terraformDirectory)


    - publish: '$(Build.ArtifactStagingDirectory)/prod.tfplan'

      artifact: terraform-prod-plan

# terraform plan -out=prod.tfplan

- stage: Apply_Production

  displayName: 'Terraform Apply - Production'

  dependsOn: Plan_Production

  jobs:

  - deployment: ApplyProduction

    displayName: 'Apply Production Infrastructure'

    environment: 'production'
    #Azure DevOps sees that deployment is targeting production and 
    #evaluates the environment's checks before allowing the deployment job to proceed.

    pool:
      vmImage: ubuntu-latest

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current

            artifact: terraform-prod-plan


          - task: TerraformInstaller@1

            inputs:
              terraformVersion: $(terraformVersion)


          - task: AzureCLI@2

            displayName: 'Terraform Init'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform init \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=prod.tfstate"

            workingDirectory: $(terraformDirectory)


          - task: AzureCLI@2

            displayName: 'Terraform Apply'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                terraform apply \
                  "$(Pipeline.Workspace)/terraform-prod-plan/prod.tfplan"

            workingDirectory: $(terraformDirectory)      